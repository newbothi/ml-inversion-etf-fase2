# Corre el linter y los tests en cada push y pull request. Si algo falla, GitHub lo marca en rojo.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # botón "Run workflow" en la pestaña Actions

permissions:
  contents: read

concurrency:              # si haces dos push seguidos, cancela la corrida anterior
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (estilo y errores comunes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.17.*"
      - run: ruff check --output-format=github .

  tests:
    name: Python ${{ matrix.python }} · pandas ${{ matrix.pandas }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        pandas: ["2.2", "3.0"]          # el README dice que funciona con ambas
        include:
          - os: windows-latest          # el mismo entorno en que se usa el proyecto
            python: "3.13"
            pandas: "3.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "pandas==${{ matrix.pandas }}.*"
      - name: Tests y cobertura (falla si baja del 90 %)
        run: python -m pytest --cov --cov-report=term